version: "3.8"

# Variante de docker-compose.yml para importar como um servico "Compose" dentro de um projeto
# Easypanel (ex: app_agendamento). Diferencas em relacao ao docker-compose.yml da raiz:
#   - Sem o servico `caddy`: o Easypanel faz proxy reverso + HTTPS automatico por servico,
#     configurado na propria UI (dominio + porta interna), entao o Caddy nao e usado neste caminho.
#   - Sem GOOGLE_SHEET_ID: os workflows deste caminho usam Supabase (n8n-workflows-supabase/),
#     nao Google Sheets.
#   - Os dois frontends (frontend-admin/, frontend-agenda/) NAO estao aqui: no Easypanel eles
#     viram dois servicos "App" separados (frontend_admin, frontend_agenda), cada um buildado a
#     partir do Dockerfile na propria pasta. Veja docs/deploy-easypanel.md.
#
# Uso: cole este arquivo no editor de "Compose" de um novo servico dentro do projeto
# app_agendamento no Easypanel, preencha as variaveis (mesmas de easypanel/app_agendamento.env.example)
# e configure dominio + porta por servico na UI do Easypanel (ver comentarios `# porta:` abaixo).

services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data

  n8n:
    # porta: 5678
    image: docker.n8n.io/n8nio/n8n:1.123.25
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://n8n.${DOMAIN}/
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      # Variaveis usadas DENTRO dos workflows (nos Code/HTTP Request via $env.*)
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - SALON_ADMIN_WHATSAPP=${SALON_ADMIN_WHATSAPP}
      - SALON_NAME=${SALON_NAME}
      - DOMAIN=${DOMAIN}
      # Multi-tenant (RLS): usadas pelos workflows admin (03,04,05,08,09,10,11) para verificar o
      # JWT do usuario logado e encaminhar as chamadas ao PostgREST com a chave anon + esse JWT,
      # em vez da service_role — assim o Postgres aplica RLS de verdade. A service_role continua
      # usada nos workflows publicos/cron/chatbot (00,01,02,06,07), que resolvem a empresa por
      # slug/instancia Evolution em vez de por usuario logado. Ver supabase/schema.sql e
      # docs/deploy-easypanel.md.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n-db

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    # porta: 8080
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_SAVE_INSTANCES=true
      - WEBHOOK_GLOBAL_URL=https://n8n.${DOMAIN}/webhook/whatsapp-in
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - TZ=${TIMEZONE}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-db
      - evolution-redis

volumes:
  n8n_data:
  n8n_db_data:
  evolution_db_data:
  evolution_redis_data:
  evolution_instances:
